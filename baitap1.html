<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Interactive Image Gallery</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        #image {
            width: 500px;
            height: 300px;
            border: 2px solid black;
            margin: 20px auto;
            line-height: 300px;
            background-size: cover;
            background-position: center;
        }

        .preview {
            width: 150px;
            margin: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h2>Interactive Image Gallery</h2>

    <div id="image">
        Di chuột qua một hình ảnh bên dưới để hiển thị ở đây.
    </div>

    <img class="preview" src="https://picsum.photos/id/1015/300/200" alt="Mountain View" onmouseover="upDate(this)"
        onmouseout="unDo()">

    <img class="preview" src="https://picsum.photos/id/1025/300/200" alt="Dog Image" onmouseover="upDate(this)"
        onmouseout="unDo()">

    <img class="preview" src="https://picsum.photos/id/1035/300/200" alt="Beach Image" onmouseover="upDate(this)"
        onmouseout="unDo()">

    <script src="script.js"></script>

</body>

</html>
